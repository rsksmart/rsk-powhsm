version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: master
    schedule:
      interval: "weekly"
    # Applies to version updates only: wait at least 10 days after a new
    # version is released before opening a PR. Security updates are triggered
    # by Dependabot alerts, so they ignore both the schedule and the cooldown.
    cooldown:
      default-days: 10
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      # one PR per week that groups BOTH minor + patch updates
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # one PR grouping all security updates, opened as alerts arrive
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Maintain dependencies for Docker
  - package-ecosystem: docker
    directories:
      - "docker/afl"
      - "docker/ledger"
      - "docker/mware"
      - "docker/packer"
      - "docker/sgx"
      - "dist/ledger"
      - "dist/sgx"
      - "firmware/test/package"
      - "utils/tcpsigner-bundle/dist/"
    target-branch: master
    schedule:
      interval: "weekly"
    # Applies to version updates only: wait at least 10 days after a new
    # version is released before opening a PR. Security updates are triggered
    # by Dependabot alerts, so they ignore both the schedule and the cooldown.
    cooldown:
      default-days: 10
    labels:
      - "dependencies"
      - "docker"
    groups:
      # one PR per week grouping base image updates across all Dockerfiles
      docker-updates:
        applies-to: version-updates
        patterns:
          - "*"
      # one PR grouping all security updates across all Dockerfiles,
      # opened as alerts arrive
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
