name: Build macOS tools

on:
  workflow_dispatch:
  push:
    paths:
      - "middleware/**"
      - ".github/workflows/build-macos-tools.yml"

# Declare default permissions as read only.
permissions: read-all

jobs:
  build-macos-arm64:
    name: Build signapp and signmigration (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install build prerequisites
        run: brew install gnu-tar

      - name: Install Python dependencies
        run: |
          python -m pip install --timeout=60 -r middleware/build/macos/requirements.txt --require-hashes
          # Hidapi wrapper with hid_exit support (same as docker/mware/Dockerfile)
          # https://github.com/rsksmart/cython-hidapi/releases/tag/0.10.1.post2 pinned by hash
          python -m pip install --timeout=60 --use-pep517 git+https://github.com/rsksmart/cython-hidapi@56d87e287e4da8fc379e3b96573f5ac93e02e613

      - name: Build signapp
        run: NATIVE=1 middleware/build/signapp

      - name: Build signmigration
        run: NATIVE=1 middleware/build/signmigration

      - name: Verify binaries
        run: |
          set -e
          for tool in signapp signmigration; do
            bin=middleware/bin/$tool/$tool
            file $bin | tee /dev/stderr | grep -q "arm64"
            codesign --verify $bin
            $bin --help > /dev/null
            # No dongle attached: this exercises the native HID stack
            # (ledgerblue + hidapi) without needing a device
            out=$($bin eth -o $RUNNER_TEMP/$tool-out.json 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "No dongle found"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: middleware-tools-macos-arm64
          path: |
            middleware/bin/signapp.tgz
            middleware/bin/signmigration.tgz
          if-no-files-found: error
